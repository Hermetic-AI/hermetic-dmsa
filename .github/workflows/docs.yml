name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    outputs:
      # Pages 未启用时不做部署, 但文档构建本身必须始终通过。
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMD skeleton
        run: pip install ./vendor/pmd-0.1.0.tar.gz
      - name: Install docs deps
        run: pip install -e ".[docs,dev]"
      - name: Build mkdocs
        run: mkdocs build --strict
      - name: Setup Pages
        id: pages
        # 仓库管理员在 Settings → Pages 把 Source 设为 GitHub Actions 之前,
        # 创建 Pages 站点需要超出 GITHUB_TOKEN 的权限。这里不阻断构建,
        # Pages 就绪后同一流水线会自动完成发布。
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.build.outputs.pages_ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
