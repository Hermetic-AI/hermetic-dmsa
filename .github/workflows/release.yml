name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build standalone source and wheelhouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMD skeleton
        run: pip install ./vendor/pmd-0.1.0.tar.gz
      - name: Install build + twine
        run: pip install build twine
      - name: Build
        run: python -m build
      - name: Build dependency wheelhouse
        run: pip wheel --require-hashes --find-links vendor -r deploy/requirements.lock -w wheelhouse
      - name: Upload standalone distribution
        uses: actions/upload-artifact@v4
        with:
          name: release-distribution
          path: |
            dist/*
            wheelhouse/*

  github-release:
    name: GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-distribution
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: |
            dist/*
            wheelhouse/*
