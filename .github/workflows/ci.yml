name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMD skeleton
        run: pip install ./vendor/pmd-0.1.0.tar.gz
      - name: Install dev deps
        run: pip install -e ".[http,dev]" httpx
      - name: ruff check
        run: ruff check src tests
      - name: ruff format check
        run: ruff format --check src tests

  type:
    name: Type Check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMD skeleton
        run: pip install ./vendor/pmd-0.1.0.tar.gz
      - name: Install dev deps
        run: pip install -e ".[http,dev]" httpx
      - name: mypy
        run: mypy src/dmsa --strict

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install PMD skeleton
        run: pip install ./vendor/pmd-0.1.0.tar.gz
      - name: Install dev deps
        run: pip install -e ".[http,dev]" httpx
      - name: pytest
        run: pytest tests/ -v

  coverage:
    name: Coverage gate (≥ 80%)
    needs: [lint, type, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMD skeleton
        run: pip install ./vendor/pmd-0.1.0.tar.gz
      - name: Install dev deps
        run: pip install -e ".[http,dev]" httpx
      - name: pytest with coverage
        run: pytest --cov=dmsa --cov-fail-under=80

  build:
    name: Build wheel + sdist
    needs: [lint, type, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PMD skeleton
        run: pip install ./vendor/pmd-0.1.0.tar.gz
      - name: Install build
        run: pip install build
      - name: Build
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  security:
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: pip install pip-audit
      - name: Audit shipped HTTP dependencies
        run: |
          # PMD is a hash-pinned local source archive; pip-audit's PyPI service cannot
          # resolve that project name. Its transitive dependencies remain in this lock
          # and are audited along with every other public runtime dependency.
          grep -v '^pmd==' deploy/requirements.lock > /tmp/dmsa-audit-requirements.lock
          pip-audit --strict --require-hashes --disable-pip -r /tmp/dmsa-audit-requirements.lock

  container:
    name: Standalone container contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./vendor/pmd-0.1.0.tar.gz ".[http,dev]" httpx
      - run: pytest tests/container_contract.py -q --no-cov
