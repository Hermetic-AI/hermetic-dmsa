services:
  memory:
    command: ["--profile", "competition", "--host", "0.0.0.0", "--storage", "/data/coding.sqlite3", "--dimension", "${DMSA_EMBEDDING_DIMENSION:-1536}"]
    restart: "no"
    environment:
      DMSA_MEMORY_API_KEY: "${DMSA_MEMORY_API_KEY:-}"
      DMSA_EMBEDDING_BASE_URL: "${DMSA_EMBEDDING_BASE_URL:-}"
      DMSA_EMBEDDING_API_KEY: "${DMSA_EMBEDDING_API_KEY:-}"
      DMSA_EMBEDDING_MODEL: "${DMSA_EMBEDDING_MODEL:-}"
      DMSA_VECTOR_URL: "http://qdrant:6333"
      DMSA_QDRANT_API_KEY: "${DMSA_QDRANT_API_KEY:-}"
    volumes:
      - competition-data:/data
    depends_on:
      qdrant:
        condition: service_healthy
  qdrant:
    image: ghcr.io/qdrant/qdrant/qdrant:v1.19.2-unprivileged@sha256:5b75894e3d9c47ef23c16bb5c23c7e03a3aa904be7e217637413420bc51c25b6
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  competition-data:
  qdrant-data:
