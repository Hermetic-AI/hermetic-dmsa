services:
  memory:
    environment:
      DMSA_MEMORY_API_KEY: ""
      DMSA_MEMORY_API_KEY_FILE: /run/secrets/memory_api_key
      DMSA_EMBEDDING_API_KEY: ""
      DMSA_EMBEDDING_API_KEY_FILE: /run/secrets/embedding_api_key
    secrets:
      - memory_api_key
      - embedding_api_key
secrets:
  memory_api_key:
    file: ./secrets/memory_api_key
  embedding_api_key:
    file: ./secrets/embedding_api_key
